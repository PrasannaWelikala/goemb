<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoEmb Admin</title>
  <meta name="theme-color" content="#4f1c79">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    // If anything fails while starting, show the reason on the page instead of a blank screen.
    function bootFail(msg) {
      window.__bootFailed = true;
      var box = document.getElementById('boot');
      if (!box) return;
      box.hidden = false;
      box.className = 'card boot bad';
      document.getElementById('bootMsg').textContent = msg;
    }
    window.addEventListener('error', function (e) {
      if (window.__bootFailed || window.__bootDone) return;
      var t = e.target;
      if (t && t.tagName === 'SCRIPT') {
        bootFail('Could not load "' + (t.getAttribute('src') || 'a script') + '". ' +
          (/^https?:/.test(t.getAttribute('src') || '')
            ? 'This is a library from the internet: check your connection, or turn off ad blockers / VPN for this site.'
            : 'Upload this file to the same folder as index.html. File names are case-sensitive (use lowercase).'));
      } else if (e.message) {
        bootFail('Startup error: ' + e.message + '. If you edited config.js, check the quotes and commas.');
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      if (window.__bootFailed || window.__bootDone) return;
      bootFail('Startup error: ' + ((e.reason && e.reason.message) || e.reason || 'unknown'));
    });
  </script>
</head>
<body>

  <div id="boot" class="card boot">
    <b>GoEmb Admin</b>
    <p id="bootMsg">Loading…</p>
  </div>

  <section id="login" hidden>
    <form id="loginForm" class="card login">
      <img class="logo-login" src="logo.jpg" alt="GoEmb">
      <div class="sub">Admin panel</div>
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Sign in</button>
      <p id="loginErr" class="err"></p>
    </form>
  </section>

  <div id="app" hidden>
    <nav id="nav"></nav>
    <main id="view"></main>
  </div>

  <dialog id="modal"></dialog>
  <div id="toast" role="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js"></script>
  <script>
    // Check the settings before the app starts.
    (function () {
      var msg = null;
      if (typeof supabase === 'undefined') {
        msg = 'The Supabase library did not load. Check your internet connection, or turn off ad blockers / VPN for this site.';
      } else if (typeof CONFIG === 'undefined') {
        msg = 'config.js did not load or has a typing mistake. Upload config.js next to index.html and check its quotes and commas.';
      } else if (!CONFIG.SUPABASE_URL || CONFIG.SUPABASE_URL.indexOf('https://') !== 0 || CONFIG.SUPABASE_URL.indexOf('YOUR-PROJECT') !== -1) {
        msg = 'Open config.js and set SUPABASE_URL to your project URL (it looks like https://abcdxyz.supabase.co).';
      } else if (!CONFIG.SUPABASE_ANON_KEY || CONFIG.SUPABASE_ANON_KEY.indexOf('YOUR-ANON') !== -1) {
        msg = 'Open config.js and set SUPABASE_ANON_KEY to your anon public key (Supabase > Project Settings > API).';
      }
      if (msg) bootFail(msg);
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
